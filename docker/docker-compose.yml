version: "3.9"

# ─── CancerGPT Full Stack ─────────────────────────────────────────────────────
# Services: API + PostgreSQL + pgAdmin (DB GUI)
#
# Usage:
#   docker-compose up --build        # Start all services
#   docker-compose down              # Stop all services
#   docker-compose logs -f api       # View API logs
#   docker-compose exec api bash     # Shell into API container

services:

  # ── CancerGPT API Server ──────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cancergpt_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database — uses PostgreSQL in Docker
      - DATABASE_URL=postgresql://cancergpt_user:cancergpt_pass@db:5432/cancergpt_db
      # API Keys — set your real keys here
      - GROQ_API_KEY=${GROQ_API_KEY:-your_groq_key_here}
      # App settings
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    volumes:
      # Mount data folders so pipeline outputs persist
      - ../processed:/app/processed
      - ../features:/app/features
      - ../rag_index:/app/rag_index
      - ../reports:/app/reports
      - ../web:/app/web
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cancergpt_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: cancergpt_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cancergpt_db
      - POSTGRES_USER=cancergpt_user
      - POSTGRES_PASSWORD=cancergpt_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cancergpt_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cancergpt_user -d cancergpt_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── pgAdmin (Database GUI) ─────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cancergpt_pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@cancergpt.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - cancergpt_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Nginx (Web Server / Reverse Proxy) ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cancergpt_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../web:/usr/share/nginx/html
    depends_on:
      - api
    networks:
      - cancergpt_network

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  cancergpt_network:
    driver: bridge

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
